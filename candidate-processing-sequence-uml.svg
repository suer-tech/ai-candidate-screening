<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="2200" viewBox="0 0 2520 2200" role="img" aria-labelledby="title desc">
  <title id="title">UML sequence diagram обработки кандидата</title>
  <desc id="desc">Последовательность взаимодействий HR, Google My Drive, durable runtime, процессоров документов и интервью, RouterAI, PostgreSQL, PDF-рендерера и Telegram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="actor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="returnArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .participant { fill: url(#actor); stroke: #4f46e5; stroke-width: 2.5; rx: 16; filter: url(#shadow); }
      .participant-external { fill: #ecfeff; stroke: #0891b2; }
      .participant-data { fill: #f0fdf4; stroke: #16a34a; }
      .participant-text { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .participant-sub { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10 9; }
      .activation { fill: #c7d2fe; stroke: #4f46e5; stroke-width: 1.5; }
      .message { stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .return { stroke: #64748b; stroke-width: 2; stroke-dasharray: 9 7; marker-end: url(#returnArrow); }
      .message-label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #1e293b; text-anchor: middle; }
      .return-label { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .frame { fill: #ffffff; fill-opacity: .62; stroke: #64748b; stroke-width: 2; rx: 14; }
      .frame-tab { fill: #334155; }
      .frame-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .guard { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .note { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; filter: url(#shadow); }
      .note-text { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #713f12; text-anchor: middle; }
      .error-line { stroke: #dc2626; stroke-width: 2.5; marker-end: url(#arrow); }
      .success-line { stroke: #16a34a; stroke-width: 3; marker-end: url(#arrow); }
      .divider { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 12 8; }
    </style>
  </defs>

  <rect width="2520" height="2200" fill="url(#bg)"/>
  <rect x="45" y="130" width="2430" height="2015" rx="30" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1260" y="65" class="title" text-anchor="middle">Обработка кандидата · UML Sequence Diagram</text>
  <text x="1260" y="103" class="subtitle" text-anchor="middle">Канонический matrix-v2 workflow: от загрузки материалов до двух PDF и уведомления HR</text>

  <!-- Participants -->
  <g>
    <rect x="55" y="165" width="220" height="82" class="participant"/>
    <text x="165" y="199" class="participant-text">HR</text>
    <text x="165" y="226" class="participant-sub">пользователь</text>

    <rect x="325" y="165" width="230" height="82" class="participant participant-external"/>
    <text x="440" y="199" class="participant-text">Google My Drive</text>
    <text x="440" y="226" class="participant-sub">материалы / результаты</text>

    <rect x="605" y="165" width="240" height="82" class="participant"/>
    <text x="725" y="199" class="participant-text">Durable Runtime</text>
    <text x="725" y="226" class="participant-sub">goal / tasks / retry</text>

    <rect x="895" y="165" width="240" height="82" class="participant"/>
    <text x="1015" y="199" class="participant-text">Document Processor</text>
    <text x="1015" y="226" class="participant-sub">PDF / DOCX / OCR</text>

    <rect x="1185" y="165" width="220" height="82" class="participant participant-external"/>
    <text x="1295" y="199" class="participant-text">AssemblyAI</text>
    <text x="1295" y="226" class="participant-sub">транскрипция</text>

    <rect x="1455" y="165" width="230" height="82" class="participant participant-external"/>
    <text x="1570" y="199" class="participant-text">RouterAI</text>
    <text x="1570" y="226" class="participant-sub">matrix / evidence</text>

    <rect x="1735" y="165" width="230" height="82" class="participant participant-data"/>
    <text x="1850" y="199" class="participant-text">PostgreSQL</text>
    <text x="1850" y="226" class="participant-sub">state / artifacts / outbox</text>

    <rect x="2015" y="165" width="220" height="82" class="participant"/>
    <text x="2125" y="199" class="participant-text">PDF Renderer</text>
    <text x="2125" y="226" class="participant-sub">2 отчёта + validation</text>

    <rect x="2285" y="165" width="180" height="82" class="participant participant-external"/>
    <text x="2375" y="199" class="participant-text">Telegram</text>
    <text x="2375" y="226" class="participant-sub">уведомление</text>
  </g>

  <!-- Lifelines -->
  <g>
    <line x1="165" y1="247" x2="165" y2="2085" class="lifeline"/>
    <line x1="440" y1="247" x2="440" y2="2085" class="lifeline"/>
    <line x1="725" y1="247" x2="725" y2="2085" class="lifeline"/>
    <line x1="1015" y1="247" x2="1015" y2="2085" class="lifeline"/>
    <line x1="1295" y1="247" x2="1295" y2="2085" class="lifeline"/>
    <line x1="1570" y1="247" x2="1570" y2="2085" class="lifeline"/>
    <line x1="1850" y1="247" x2="1850" y2="2085" class="lifeline"/>
    <line x1="2125" y1="247" x2="2125" y2="2085" class="lifeline"/>
    <line x1="2375" y1="247" x2="2375" y2="2085" class="lifeline"/>
  </g>

  <!-- Initial discovery -->
  <line x1="165" y1="300" x2="440" y2="300" class="message"/>
  <text x="302" y="288" class="message-label">1. Загрузить резюме, интервью и материалы</text>

  <rect x="715" y="335" width="20" height="1425" class="activation"/>
  <line x1="725" y1="350" x2="440" y2="350" class="message"/>
  <text x="582" y="338" class="message-label">2. Найти папки кандидатов</text>
  <line x1="440" y1="390" x2="725" y2="390" class="return"/>
  <text x="582" y="378" class="return-label">folder IDs + список объектов, кроме «Результаты»</text>

  <!-- Stability loop -->
  <rect x="300" y="415" width="610" height="175" class="frame"/>
  <path d="M300 415 H420 V445 H300 Z" class="frame-tab"/>
  <text x="315" y="436" class="frame-title">loop</text>
  <text x="438" y="438" class="guard">[пока загрузка нестабильна]</text>
  <line x1="725" y1="475" x2="440" y2="475" class="message"/>
  <text x="582" y="463" class="message-label">3. Проверить размер / modifiedTime</text>
  <line x1="440" y1="520" x2="725" y2="520" class="return"/>
  <text x="582" y="508" class="return-label">WAITING_FOR_STABILITY или стабильный snapshot</text>
  <path d="M620 545 H830 V607 L806 625 H620 Z" class="note"/>
  <text x="725" y="570" class="note-text">Не анализировать</text>
  <text x="725" y="592" class="note-text">частичную загрузку</text>

  <line x1="725" y1="625" x2="1850" y2="625" class="message"/>
  <text x="1288" y="613" class="message-label">4. Зафиксировать run, inputVersion и profileVersion</text>
  <rect x="1840" y="615" width="20" height="1180" class="activation"/>
  <line x1="1850" y1="660" x2="725" y2="660" class="return"/>
  <text x="1288" y="648" class="return-label">runId + immutable input snapshot</text>

  <!-- Parallel preparation -->
  <rect x="865" y="690" width="850" height="385" class="frame"/>
  <path d="M865 690 H970 V720 H865 Z" class="frame-tab"/>
  <text x="880" y="711" class="frame-title">par</text>
  <text x="987" y="713" class="guard">[обработка входа и компиляция матрицы]</text>

  <line x1="725" y1="755" x2="1015" y2="755" class="message"/>
  <text x="870" y="743" class="message-label">5a. Извлечь документы</text>
  <rect x="1005" y="745" width="20" height="115" class="activation"/>
  <line x1="1015" y1="820" x2="725" y2="820" class="return"/>
  <text x="870" y="808" class="return-label">текст / OCR + точные локаторы</text>

  <line x1="725" y1="890" x2="1295" y2="890" class="message"/>
  <text x="1010" y="878" class="message-label">5b. Отправить интервью на транскрипцию</text>
  <rect x="1285" y="880" width="20" height="115" class="activation"/>
  <line x1="1295" y1="960" x2="725" y2="960" class="return"/>
  <text x="1010" y="948" class="return-label">реплики + speaker labels + таймкоды</text>

  <line x1="725" y1="1015" x2="1570" y2="1015" class="message"/>
  <text x="1148" y="1003" class="message-label">5c. Скомпилировать vacancy matrix</text>
  <rect x="1560" y="1005" width="20" height="60" class="activation"/>
  <line x1="1570" y1="1055" x2="725" y2="1055" class="return"/>
  <text x="1148" y="1043" class="return-label">версионированные критерии / ABC / stop factors</text>

  <!-- Context and evidence -->
  <line x1="725" y1="1115" x2="1850" y2="1115" class="message"/>
  <text x="1288" y="1103" class="message-label">6. Сохранить артефакты документов, транскрипции и матрицы</text>

  <line x1="725" y1="1175" x2="1850" y2="1175" class="message"/>
  <text x="1288" y="1163" class="message-label">7. Context search → прочитать полные релевантные фрагменты</text>
  <line x1="1850" y1="1215" x2="725" y2="1215" class="return"/>
  <text x="1288" y="1203" class="return-label">decision-safe context с provenance</text>

  <line x1="725" y1="1275" x2="1570" y2="1275" class="message"/>
  <text x="1148" y="1263" class="message-label">8. Сформировать claims, evidence и conflicts</text>
  <rect x="1560" y="1265" width="20" height="165" class="activation"/>
  <line x1="1570" y1="1325" x2="725" y2="1325" class="return"/>
  <text x="1148" y="1313" class="return-label">граф доказательств + недостаток данных</text>
  <line x1="725" y1="1375" x2="1570" y2="1375" class="message"/>
  <text x="1148" y="1363" class="message-label">9. Заполнить matrix rows и проверить critical claims</text>
  <line x1="1570" y1="1420" x2="725" y2="1420" class="return"/>
  <text x="1148" y="1408" class="return-label">assessment snapshot + deterministic recommendation</text>

  <line x1="725" y1="1470" x2="1850" y2="1470" class="message"/>
  <text x="1288" y="1458" class="message-label">10. Persist evidence, rows, recommendation и trace</text>

  <!-- Validation alt -->
  <rect x="575" y="1510" width="1350" height="325" class="frame"/>
  <path d="M575 1510 H670 V1540 H575 Z" class="frame-tab"/>
  <text x="590" y="1531" class="frame-title">alt</text>
  <text x="688" y="1533" class="guard">[валидация результата]</text>

  <path d="M760 1560 l330 0 l0 80 l-25 20 l-305 0 z" class="note"/>
  <text x="925" y="1590" class="note-text">Проверить схему, доказательность, непротиворечивость</text>
  <text x="925" y="1617" class="note-text">и полноту обязательных разделов</text>

  <line x1="575" y1="1680" x2="1925" y2="1680" class="divider"/>
  <text x="595" y="1668" class="guard">[невалидно]</text>
  <line x1="725" y1="1730" x2="1850" y2="1730" class="error-line"/>
  <text x="1288" y="1718" class="message-label">FAILED: типизированная причина, retry / эскалация</text>

  <text x="595" y="1810" class="guard">[валидно]</text>

  <!-- Reports and publication -->
  <line x1="725" y1="1870" x2="2125" y2="1870" class="message"/>
  <text x="1425" y="1858" class="message-label">11. Создать ABC-тест и «Итоги по кандидату» из одной версии анализа</text>
  <rect x="2115" y="1860" width="20" height="135" class="activation"/>
  <path d="M2125 1900 h145 v55 h-145" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="2210" y="1892" class="message-label">12. Render + parse + validate 2 PDF</text>
  <line x1="2125" y1="1980" x2="725" y2="1980" class="return"/>
  <text x="1425" y="1968" class="return-label">PDF bytes + SHA-256 checksums</text>

  <line x1="725" y1="2025" x2="440" y2="2025" class="success-line"/>
  <text x="582" y="2013" class="message-label">13. Атомарно опубликовать пару в Результаты/vNNNN</text>
  <line x1="440" y1="2060" x2="725" y2="2060" class="return"/>
  <text x="582" y="2048" class="return-label">2 file IDs + checksums</text>

  <line x1="725" y1="2095" x2="1850" y2="2095" class="success-line"/>
  <text x="1288" y="2083" class="message-label">14. Commit READY + publication metadata + notification outbox</text>
  <line x1="725" y1="2130" x2="2375" y2="2130" class="message"/>
  <text x="1550" y="2118" class="message-label">15. Уведомить HR со ссылкой на итоговый PDF</text>

  <text x="1260" y="2180" class="subtitle" text-anchor="middle">Если Telegram недоступен: delivery → FAILED / WAITING_CONFIGURATION, но опубликованный кандидат остаётся READY</text>
</svg>
